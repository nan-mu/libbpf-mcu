[workspace]
authors = ["nan-mu <mu.nan.11@outlook.com>"]
channels = ["conda-forge"]
name = "libbpf-mcu"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
build = "python make/cli.py build"
clean = "python make/cli.py clean"
test = "python make/cli.py test"
prepare-release = "python make/release.py prepare"
verify-release = "python make/release.py verify"
next-release-tag = "python make/release.py next-tag"
retarget = "python make/retarget.py"

[dependencies]
python = ">=3.14.6,<3.15"

[pypi-dependencies]
tiny_log = { git = "https://github.com/nan-mu/tiny-log-py.git", branch = "dev" }
