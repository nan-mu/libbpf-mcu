name: Build system checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test tools
        run: python -m pip install ninja ruff==0.14.5 'tiny-log @ git+https://github.com/nan-mu/tiny-log-py.git@6a337276070cdd8e4f160b57b722b06020d63bff'
      - name: Protocol, path, hash, and incremental tests
        run: |
          python make/test_layout.py
          python make/test_incremental.py
          python scripts/test_publish_artifacts.py
          python make/test_xpost_mem.py
          python make/test_btf_layout.py
          python make/test_prevail_select.py
      - name: Syntax and static checks
        run: |
          python -m compileall -q make scripts/publish_artifacts.py scripts/test_publish_artifacts.py
          ruff check --select E9,F63,F7,F82 make scripts/publish_artifacts.py scripts/test_publish_artifacts.py
          ruff format --check scripts/publish_artifacts.py scripts/test_publish_artifacts.py
          git diff --check
