[package]
name = "libbpf-mcu-tools"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host ELF helpers for libbpf-mcu (XPM1 + Compact ELF via xpost-elf)"

[workspace]

[[bin]]
name = "xpost-mcu-elf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
toml = "1.1.3"
heapless = "0.9.3"
xpost-elf = { path = "../../xpost/xpost-elf" }
