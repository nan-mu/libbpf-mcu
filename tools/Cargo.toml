[package]
name = "libbpf-mcu-tools"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host ELF helpers for libbpf-mcu (XPM1 + Compact ELF via xpost-elf)"

[workspace]

[[bin]]
name = "xpost-mcu-elf"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
toml = "1.1.3"
heapless = "0.9.3"
xpost-elf = { git = "https://github.com/nan-mu/xpost.git", rev = "9cb03b795c8d45c5d107cf8e63b90dca6f1dcb56" }
rbpf = { git = "https://github.com/nan-mu/xpost.git", rev = "9cb03b795c8d45c5d107cf8e63b90dca6f1dcb56", default-features = false, features = ["mcu"] }
xpost-jit = { path = "../jit" }
