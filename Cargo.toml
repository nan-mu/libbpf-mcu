[workspace]
resolver = "3"
members = ["crates/*", "jit", "jit/oracle", "tools"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "write", "elf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"
heapless = "0.9.3"
xpost-elf = { git = "https://github.com/nan-mu/xpost.git", rev = "9cb03b795c8d45c5d107cf8e63b90dca6f1dcb56" }
rbpf = { git = "https://github.com/nan-mu/xpost.git", rev = "9cb03b795c8d45c5d107cf8e63b90dca6f1dcb56", default-features = false, features = ["mcu"] }
xpost-jit = { path = "jit" }
mcu-bpf = { path = "crates/mcu-bpf" }
mcu-image = { path = "crates/mcu-image" }
mcu-index = { path = "crates/mcu-index" }
mcu-report = { path = "crates/mcu-report" }

[profile.test]
opt-level = 2
